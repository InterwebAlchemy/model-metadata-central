model_id: gpt-4o
model_name: GPT-4o
model_provider: openai
model_description: GPT-4 Omni — multimodal model with vision, audio, and text. Fast and cost-efficient relative to GPT-4 Turbo.
model_info: https://platform.openai.com/docs/models/gpt-4o
model_type: chat
context_window: 128000
max_tokens: 32768
cost_per_million_tokens:
  input: 5
  output: 15
tuning: [multimodal]
tokenizer:
  family: tiktoken
  name: o200k_base
input_type: [text, image, audio]
output_type: [text]
providers:
  - provider_id: openai
    model_id_on_provider: gpt-4o
  - provider_id: openrouter
    model_id_on_provider: openai/gpt-4o
    cost_per_million_tokens:
      input: 2.5
      output: 10
    model_info: https://openrouter.ai/openai/gpt-4o
