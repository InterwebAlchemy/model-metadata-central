model_id: claude-opus-5
model_name: Claude Opus 5
model_provider: anthropic
model_description: |
  Anthropic's flagship Opus-tier model. Adaptive thinking is on by default (omitting the thinking parameter
  runs it), and effort is tunable from low through max. Supports a 1M-token context window, 128K max output, task budgets,
  mid-conversation system messages, and fast mode. budget_tokens and assistant prefill are removed and return a 400.
model_info: https://docs.anthropic.com/en/docs/models/claude-opus-5
model_type: chat
context_window: 1000000
max_tokens: 128000
cost_per_million_tokens:
  input: 5
  cached_input: 0.5
  cache_write_input: 6.25
  output: 25
tuning: [function, reasoning]
input_type: [text, image]
output_type: [text]
providers:
  - provider_id: anthropic
    model_id_on_provider: claude-opus-5
  - provider_id: openrouter
    model_id_on_provider: anthropic/claude-opus-5
    model_info: https://openrouter.ai/anthropic/claude-opus-5
