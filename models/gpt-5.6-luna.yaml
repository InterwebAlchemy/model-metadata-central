model_id: gpt-5.6-luna
model_name: GPT-5.6 Luna
model_provider: openai
model_description: |
  Smallest and cheapest tier of the GPT-5.6 family, at one tenth Terra's input cost while keeping the full
  1.05M-token context window and 128K output limit. Suited to high-volume classification, extraction, and routing.
model_info: https://platform.openai.com/docs/models/gpt-5.6-luna
model_type: chat
context_window: 1050000
max_tokens: 128000
cost_per_million_tokens:
  input: 0.2
  cached_input: 0.02
  output: 1.2
knowledge_cutoff: "2026-02-16"
tuning: [function, structured]
input_type: [text, image]
output_type: [text]
providers:
  - provider_id: openai
    model_id_on_provider: gpt-5.6-luna
  - provider_id: openrouter
    model_id_on_provider: openai/gpt-5.6-luna
    cost_per_million_tokens:
      input: 0.2
      cached_input: 0.02
      cache_write_input: 0.25
      output: 1.2
    model_info: https://openrouter.ai/openai/gpt-5.6-luna
