model_id: gpt-5.6-sol
model_name: GPT-5.6 Sol
model_provider: openai
model_description: |
  Top tier of the GPT-5.6 family, superseded as OpenAI's flagship by GPT-6 Astra but still served. Aliased
  as gpt-5.6. Accepts text and image input with text output. OpenAI lists promotional pricing available at least through
  2026-11-21; the rates here are the standard published rates, and OpenRouter currently bills below them.
model_info: https://platform.openai.com/docs/models/gpt-5.6-sol
model_type: chat
context_window: 1050000
max_tokens: 128000
cost_per_million_tokens:
  input: 4
  cached_input: 0.4
  output: 20
knowledge_cutoff: "2026-02-16"
tuning: [function, reasoning, structured]
input_type: [text, image]
output_type: [text]
providers:
  - provider_id: openai
    model_id_on_provider: gpt-5.6-sol
  - provider_id: openrouter
    model_id_on_provider: openai/gpt-5.6-sol
    cost_per_million_tokens:
      input: 2
      cached_input: 0.2
      cache_write_input: 2.5
      output: 10
    model_info: https://openrouter.ai/openai/gpt-5.6-sol
