model_id: grok-4.6
model_name: Grok 4.6
model_provider: x-ai
model_description: |
  xAI's current flagship Grok model. Trades the very large context window of the Grok 4.20 line for a
  500K-token window with a 450K output limit, at a higher per-token price.
model_info: https://docs.x.ai/docs/models
model_type: chat
context_window: 500000
max_tokens: 450000
cost_per_million_tokens:
  input: 2
  cached_input: 0.5
  output: 6
tuning: [function, reasoning]
input_type: [text, image]
output_type: [text]
providers:
  - provider_id: x-ai
    model_id_on_provider: grok-4.6
  - provider_id: openrouter
    model_id_on_provider: x-ai/grok-4.6
    model_info: https://openrouter.ai/x-ai/grok-4.6
