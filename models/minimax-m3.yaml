model_id: minimax-m3
model_name: MiniMax M3
model_provider: minimax
model_description: |
  MiniMax-M3 is a multimodal foundation model from MiniMax. It supports text, image, and video inputs with text output, a 1M-token context window, and is suited for
  long-horizon agentic work, coding, and tool use. It is built on MiniMax Sparse Attention (MSA), which replaces full attention with KV-block selection to cut per-token
  compute at long context — roughly 1/20 the cost of the previous generation at 1M tokens, with substantially faster prefill and decode while retaining quality across
  most tasks.
model_info: "https://www.minimax.io/models/text/m3"
model_type: chat
context_window: 512000
max_tokens: 128000
cost_per_million_tokens:
  input: 0.6
  output: 2.4
tuning: [function, instruction, code, multilingual]
input_type: [text, image, video]
output_type: [text]
providers:
  - provider_id: minimax
    model_id_on_provider: MiniMax-M3
  - provider_id: openrouter
    model_id_on_provider: minimax/minimax-m3
    cost_per_million_tokens:
      input: 0.3
      cached_input: 0.06
      output: 1.2
    model_info: https://openrouter.ai/minimax/minimax-m3
