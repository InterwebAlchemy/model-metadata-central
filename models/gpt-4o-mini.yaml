model_id: gpt-4o-mini
model_name: GPT-4o Mini
model_provider: openai
model_description: Smaller, faster, cheaper GPT-4o. Optimized for high-volume, cost-sensitive applications.
model_info: https://platform.openai.com/docs/models/gpt-4o-mini
model_type: chat
context_window: 128000
max_tokens: 16384
cost_per_million_tokens:
  input: 0.15
  output: 0.6
tuning: [multimodal]
tokenizer:
  family: tiktoken
  name: o200k_base
input_type: [text, image]
output_type: [text]
providers:
  - provider_id: openai
    model_id_on_provider: gpt-4o-mini
  - provider_id: openrouter
    model_id_on_provider: openai/gpt-4o-mini
    model_info: https://openrouter.ai/openai/gpt-4o-mini